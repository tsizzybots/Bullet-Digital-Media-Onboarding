# The PAIR to the one above. Recovering the zombie by rolling back
# UNCONDITIONALLY silently discarded the possible-duplicate flag on every
# ordinary failure - a regression introduced BY the first fix and caught by
# this gate, not by review. Both directions need a killing test or the next
# edit picks whichever one is unguarded.
[[mutation]]
name = "...without discarding the possible-duplicate flag on ordinary failures"
file = "src/bullet_api/worker/ghl_subaccount.py"
find = "        try:\n            await fail_action(session, action_id=begun.action_id, last_error=str(exc))\n            await session.commit()\n        except SQLAlchemyError:\n            await session.rollback()"
replace = "        if True:\n            await session.rollback()"
must_fail = "tests/test_ghl_subaccount.py::test_possible_duplicate_flag_survives_an_ordinary_create_failure"
requires_db = true

