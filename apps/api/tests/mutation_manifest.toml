# G2 - the mutation manifest.
#
# Every guard names the test that KILLS it. `review_gate_mutate.py` breaks each
# guard in turn, runs only the named test, and asserts that test FAILS. A guard
# whose test still passes while the guard is broken is revert-green: it looks
# defended and is not.
#
# This exists because five consecutive review rounds landed the same finding -
# the fix was right, the test proving it was missing or could not fail. Round 5
# put it plainly: "Delete all three guards and 609 tests still pass."
#
# Adding an entry is cheap. Skipping one costs a review round.

# --- normalize_postcode, specified in round 7 ---------------------------------
# This function produced a blocking finding in FOUR consecutive rounds (4-7),
# each fix trading one axis for another until round 7 proved the axes jointly
# unsatisfiable and specified the token path as the flat ordered string. Each
# mutation below reintroduces the EXACT form some earlier round shipped, and
# each is killed by a property test whose oracle is independent of the
# implementation - the round-7 diagnosis was that the previous property file's
# oracle was the implementation's own transform, a tautology.

