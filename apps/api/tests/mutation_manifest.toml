# G2 - the mutation manifest.
#
# Every guard names the test that KILLS it. `review_gate_mutate.py` breaks each
# guard in turn, runs only the named test, and asserts that test FAILS. A guard
# whose test still passes while the guard is broken is revert-green: it looks
# defended and is not.
#
# This exists because five consecutive review rounds landed the same finding -
# the fix was right, the test proving it was missing or could not fail. Round 5
# put it plainly: "Delete all three guards and 609 tests still pass."
#
# Adding an entry is cheap. Skipping one costs a review round.

[[mutation]]
name = "F2 - postcode form invariance (no token sorting)"
file = "src/bullet_api/worker/identity_key.py"
find = "    stripped = \"\".join(tokens)"
replace = "    stripped = \"\".join(sorted(tokens))"
must_fail = "tests/test_identity_key.py::TestPostcodeFormInvariance"

[[mutation]]
name = "F2 - relaxed UK separator (round 4's whitespace-only form)"
file = "src/bullet_api/worker/identity_key.py"
find = "[\\s,.\\-]*([0-9][A-Z]{2})"
replace = "\\s*([0-9][A-Z]{2})"
must_fail = "tests/test_identity_key.py::TestPostcodeFormInvariance"

[[mutation]]
name = "F3 - anchored _UK_POSTCODE (round 4's one-liner)"
file = "src/bullet_api/worker/identity_key.py"
find = "r\"(?<![A-Z0-9])([A-Z]{1,2}[0-9][A-Z0-9]?)[\\s,.\\-]*([0-9][A-Z]{2})(?![A-Z0-9])\""
replace = "r\"([A-Z]{1,2}[0-9][A-Z0-9]?)[\\s,.\\-]*([0-9][A-Z]{2})\""
must_fail = "tests/test_identity_key.py::TestMalformedPostcodeNeverMintsAUkKey"

[[mutation]]
name = "F3 - sequential-digit phone filler (round 4's one-liner)"
file = "src/bullet_api/worker/identity_key.py"
find = "        or _is_sequential_digits(tail)\n"
replace = ""
must_fail = "tests/test_identity_key.py::TestSequentialDigitFiller"

