[project]
name = "bullet-api"
version = "0.0.0"
description = "Bullet Digital Media API (FastAPI). Phase 1 onboarding orchestration."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "pydantic-settings>=2.6,<3.0",
    "greenlet>=3.1,<4.0",
    "argon2-cffi>=23.1,<26.0",
    "email-validator>=2.2,<3.0",
    "itsdangerous>=2.2,<3.0",
    "httpx>=0.27,<1.0",
    "inngest>=0.4,<1.0",
    "sentry-sdk[fastapi]>=2.0,<3.0",
    "boto3>=1.35,<2.0",
    "google-auth[requests]>=2.30,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.7,<1.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bullet_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "db: requires a live database (skipped when DATABASE_URL is unreachable)",
]
