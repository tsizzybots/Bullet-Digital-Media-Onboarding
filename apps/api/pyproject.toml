[project]
name = "bullet-api"
version = "0.0.0"
description = "Bullet Digital Media API (FastAPI). Phase 1 onboarding orchestration."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.7,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bullet_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
