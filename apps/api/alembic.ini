; Alembic config for the Bullet API.
; sqlalchemy.url is intentionally blank: env.py reads DATABASE_URL via
; bullet_api.config.Settings and rewrites it to postgresql+asyncpg://.
; Per-PR Neon branching (S1-33) works by overriding DATABASE_URL in the
; CI environment - no change to this file is required.

[alembic]
script_location = alembic
prepend_sys_path = src
sqlalchemy.url =

; Migration filenames are <revision>_<slug>.py; revisions are short numeric
; prefixes set explicitly per migration (0001_, 0002_, ...) to keep ordering
; obvious. file_template applies only to migrations generated without an
; explicit --rev-id.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
