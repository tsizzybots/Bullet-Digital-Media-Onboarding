name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit (incl. gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit==4.0.1
      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  node:
    name: Node (pnpm) - typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r --if-present typecheck
      - name: Build
        run: pnpm -r --if-present build

  python:
    name: Python (uv) - lint + migrate + test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://bullet:bullet@localhost:5432/bullet_dev
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bullet
          POSTGRES_PASSWORD: bullet
          POSTGRES_DB: bullet_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bullet -d bullet_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"
      - name: Sync dependencies
        run: uv sync --all-packages
      - name: Ruff lint
        run: uv run ruff check apps/api
      - name: Alembic upgrade head
        working-directory: apps/api
        run: uv run alembic upgrade head
      - name: Alembic downgrade base (reversibility check)
        working-directory: apps/api
        run: uv run alembic downgrade base
      - name: Alembic upgrade head (back up before tests)
        working-directory: apps/api
        run: uv run alembic upgrade head
      - name: Pytest
        run: uv run pytest apps/api -q
