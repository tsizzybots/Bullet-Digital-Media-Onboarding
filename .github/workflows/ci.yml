# CI workflow for Bullet Digital Media onboarding platform.
#
# Required GitHub secrets:
#   NEON_API_KEY             - Neon API key (console.neon.tech -> Account Settings -> API Keys)
#   NEON_PROJECT_ID          - Neon project ID for the bullet-staging project
#   NEON_STAGING_DATABASE_URL - Fallback DATABASE_URL if Neon branch creation fails
#                               (use the main branch connection string)
#
# Per-PR Neon branches are created on pull_request events and torn down when
# the workflow finishes (success or failure). Push-to-main runs use the
# run ID as a unique suffix so branches are also cleaned up after each run.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Pre-commit (gitleaks, trailing whitespace, yaml, etc.) ─────────────────
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit==4.0.1

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  # ── Python: lint + format check ───────────────────────────────────────────
  python-checks:
    name: Python lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Lint (ruff check)
        run: uv run ruff check apps/api

      - name: Format check (ruff format)
        run: uv run ruff format --check apps/api

      # TODO(S1-33): enable mypy once mypy config is added to apps/api/pyproject.toml
      # - name: Typecheck (mypy)
      #   run: uv run mypy apps/api/src

  # ── Codegen drift check (OpenAPI -> TS client, S1-17) ─────────────────────
  # Regenerates packages/shared/openapi.json + the typed TS client from the
  # live FastAPI app and fails if they differ from what's committed. This is
  # what enforces "the dashboard build breaks if it drifts from the API
  # contract": change an endpoint without re-running `make codegen` and CI
  # red-flags it here. Needs both stacks (uv to dump the schema, pnpm to
  # generate the types).
  codegen:
    name: OpenAPI codegen drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: |
          uv sync --all-packages
          pnpm install --frozen-lockfile

      - name: Regenerate OpenAPI client
        run: make codegen

      - name: Fail on drift
        run: |
          git diff --exit-code -- packages/shared/openapi.json packages/shared/src/generated \
            || { echo "::error::Generated API client is stale. Run 'make codegen' and commit packages/shared/openapi.json + packages/shared/src/generated/."; exit 1; }

  # ── TypeScript: lint + typecheck ──────────────────────────────────────────
  typescript-checks:
    name: TypeScript lint + typecheck
    runs-on: ubuntu-latest
    needs: [codegen]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      # Best-effort: eslint-config-next is being added during dashboard conversion.
      # Remove the || true once eslint is fully configured across all packages.
      - name: Lint
        run: pnpm -r --if-present lint || true

  # ── Python tests (with per-PR Neon branch) ────────────────────────────────
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    needs: [python-checks]
    steps:
      - uses: actions/checkout@v4
        with:
          # The review gate diffs against the merge base. A shallow checkout has
          # no `main` ref, and the gate EXITS rather than reporting a vacuous
          # pass over an empty diff - so this is required, not cosmetic.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-packages

      # Create an ephemeral Neon branch for isolation.
      # PR runs use the PR number; push-to-main uses the workflow run ID.
      # continue-on-error: true means tests still run against the fallback URL
      # if the Neon API is temporarily unavailable.
      - name: Create Neon branch
        id: neon-branch
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: ci/pr-${{ github.event.number || github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
        continue-on-error: true

      - name: Run Alembic migrations
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url || secrets.NEON_STAGING_DATABASE_URL }}
        working-directory: apps/api
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Run pytest
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url || secrets.NEON_STAGING_DATABASE_URL }}
        run: uv run pytest apps/api -v --tb=short

      # The review gate, on the same job because the mutation half needs the
      # SAME database the suite just used. Review round 6, P1: without this the
      # gate is a point-in-time measurement on one laptop - the manifest rots
      # silently and a stale `find` pattern (correctly reported ERROR) never
      # surfaces. The mechanism built to stop round 6 would not have survived
      # its first refactor.
      #
      # `--include-db` is deliberate: db-marked guards SKIP without Postgres, a
      # skipped test cannot fail, so it cannot prove a guard. The runner reports
      # UNPROVEN and fails, which is the whole point.
      - name: Review gate (static checks)
        run: uv run python apps/api/scripts/review_gate.py --base origin/${{ github.base_ref || 'main' }}

      - name: Review gate (mutation manifest)
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url || secrets.NEON_STAGING_DATABASE_URL }}
        run: uv run python apps/api/scripts/review_gate_mutate.py --include-db

      # Always clean up the ephemeral branch, even if earlier steps failed.
      - name: Delete Neon branch
        if: always() && steps.neon-branch.outcome == 'success'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ci/pr-${{ github.event.number || github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
