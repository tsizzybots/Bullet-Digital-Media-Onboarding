# ─────────────────────────────────────────────────
# Bullet Digital Media — Render Blueprint
# ─────────────────────────────────────────────────
#
# Workspace: this Blueprint targets the client-owned Render workspace
# `Agents's workspace` (tea-d80mkougvqtc73dmah20, owner
# agents@bulletdigitalmedia.com). The IzzyAgents workspace
# (tea-cunci5popnds73d4n8g0) hosts the legacy static site
# `Bullet-Digital-Media-Progress` (slug bullet-digital-media-progress,
# srv-d7s18ajbc2fs738mgei0), which auto-deploys from this same repo
# via its own per-service GitHub connection - NOT via this Blueprint.
# It is therefore safe to push render.yaml changes without touching
# the IzzyAgents workspace.
#
# Service naming: `bullet-<role>-<env>`. Phase 1 ships staging only;
# production services are added later in Sprint 1 by duplicating the
# staging blocks with `-prod` suffixes and pointing them at
# bullet-prod-env. The prod env group itself is declared up-front
# (S1-03) so its DATABASE_URL slot is ready when the first prod
# service lands.
#
# S1-04 scope: bullet-api-staging is fully wired with /healthz.
# bullet-worker-staging, bullet-dashboard-staging, bullet-cron-staging
# are declared with placeholder commands so the Render Blueprint
# reflects PRD §11 topology; their real implementations land in S1-19,
# S1-16, and a later sprint respectively by editing this same file.

envVarGroups:
  - name: bullet-staging-env
    envVars:
      # Neon staging connection string. Pasted into the Render dashboard
      # once via the env group screen; never committed.
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
      - key: NODE_VERSION
        value: "20"

  - name: bullet-prod-env
    envVars:
      # Neon production connection string. Same handling as staging:
      # pasted into the Render dashboard via the env group screen,
      # never committed. No prod services consume this group yet
      # (they land later in Sprint 1) - the group exists now so the
      # secret is in place before those services boot.
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
      - key: NODE_VERSION
        value: "20"

services:
  # NOTE: the legacy static site `Bullet-Digital-Media-Progress`
  # (slug bullet-digital-media-progress) lives in the IzzyAgents
  # workspace and is intentionally NOT declared here. It was never
  # actually instantiated as a Blueprint service - the previous
  # render.yaml `bullet-progress` block was aspirational. The live
  # service auto-deploys from this repo via its own per-service
  # GitHub connection. To rebuild or reconfigure it, edit it
  # directly in the Render dashboard. See docs/CHANGELOG.md entry
  # 18/05/2026 (workspace remediation) for context.

  # ─── FastAPI (staging) ────────────────────────────────
  # Fully functional: serves GET /healthz returning {"status":"ok"}.
  # Real routes, DB session wiring, and middleware land in S1-12.
  - type: web
    name: bullet-api-staging
    runtime: python
    rootDir: apps/api
    plan: starter
    branch: main
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn bullet_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - fromGroup: bullet-staging-env

  # ─── Inngest worker (staging) ─────────────────────────
  # Placeholder: long-running process that prints a marker line and
  # sleeps. Replaced in S1-19 when Inngest worker registration lands.
  # Background workers do not expose an HTTP port, so no /healthz.
  - type: worker
    name: bullet-worker-staging
    runtime: python
    rootDir: apps/api
    plan: starter
    branch: main
    buildCommand: pip install uv && uv sync --frozen
    startCommand: >-
      uv run python -c "import time, sys;
      print('bullet-worker-staging placeholder - replace in S1-19', flush=True);
      sys.stdout.flush();
      [time.sleep(3600) for _ in iter(int, 1)]"
    envVars:
      - fromGroup: bullet-staging-env

  # ─── Next.js dashboard (staging) ──────────────────────
  # Placeholder: static one-pager. S1-16 replaces this block with the
  # real Next.js build (runtime: node, buildCommand: pnpm build, etc.)
  # and at that point adds an app/healthz/route.ts endpoint.
  - type: web
    name: bullet-dashboard-staging
    runtime: static
    branch: main
    buildCommand: >-
      mkdir -p .placeholder &&
      printf '%s'
      '<!doctype html><html><head><meta charset="utf-8"><title>bullet-dashboard-staging</title></head><body><h1>placeholder</h1><p>Next.js scaffold lands in S1-16.</p></body></html>'
      > .placeholder/index.html
    staticPublishPath: .placeholder

  # ─── Cron job (staging) ───────────────────────────────
  # Render's native cron-job type runs a command on schedule with no
  # HTTP surface. Verification for S1-04 is a one-off manual run that
  # exits 0. Real reconciliation logic lands when the first job is
  # defined (later sprint).
  - type: cron
    name: bullet-cron-staging
    runtime: python
    rootDir: apps/api
    plan: starter
    branch: main
    schedule: "0 2 * * *"
    buildCommand: pip install uv && uv sync --frozen
    startCommand: >-
      uv run python -c "print('bullet-cron-staging placeholder - replace when first reconciliation job lands')"
    envVars:
      - fromGroup: bullet-staging-env
