# ─────────────────────────────────────────────────
# Bullet Digital Media — Render Blueprint
# ─────────────────────────────────────────────────
#
# Workspace: this Blueprint targets the client-owned Render workspace
# `Agents's workspace` (tea-d80mkougvqtc73dmah20, owner
# agents@bulletdigitalmedia.com). The IzzyAgents workspace
# (tea-cunci5popnds73d4n8g0) hosts the legacy static site
# `Bullet-Digital-Media-Progress` (slug bullet-digital-media-progress,
# srv-d7s18ajbc2fs738mgei0), which auto-deploys from this same repo
# via its own per-service GitHub connection - NOT via this Blueprint.
# It is therefore safe to push render.yaml changes without touching
# the IzzyAgents workspace.
#
# Service naming: `bullet-<role>-<env>`. Phase 1 ships staging only;
# production services are added later in Sprint 1 by duplicating the
# staging blocks with `-prod` suffixes and pointing them at
# bullet-prod-env. The prod env group itself is declared up-front
# (S1-03) so its DATABASE_URL slot is ready when the first prod
# service lands.
#
# S1-04 scope: bullet-api-staging is fully wired with /healthz.
# bullet-worker-staging, bullet-dashboard-staging, bullet-cron-staging
# are declared with placeholder commands so the Render Blueprint
# reflects PRD §11 topology; their real implementations land in S1-19,
# S1-16, and a later sprint respectively by editing this same file.

envVarGroups:
  - name: bullet-staging-env
    envVars:
      # Neon staging connection string. Pasted into the Render dashboard
      # once via the env group screen; never committed.
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
      - key: NODE_VERSION
        value: "20"
      # Authentication (S1-14)
      - key: EMAIL_TOKEN_SECRET
        sync: false
      - key: DATABASE_SSL_MODE
        value: "require"
      # Resend email (S1-14)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "onboarding@bulletdigitalmedia.com"
      - key: EMAIL_CONFIRMATION_BASE_URL
        sync: false  # https://bullet-dashboard-staging.onrender.com/confirm
      # Inngest (S1-19)
      - key: INNGEST_SIGNING_KEY
        sync: false
      - key: INNGEST_EVENT_KEY
        sync: false
      # Sentry (S1-20)
      # Shared per environment: applies to every service in this env group.
      - key: SENTRY_ENVIRONMENT
        value: "staging"
      # PandaDoc webhook (S1-22) - per account (S1-25c: UK + International)
      - key: PANDADOC_WEBHOOK_SECRET_UK
        sync: false
      - key: PANDADOC_WEBHOOK_SECRET_INT
        sync: false
      # S1-23 reconciliation cron + S1-25c per-account API keys
      - key: PANDADOC_API_KEY_UK
        sync: false
      - key: PANDADOC_API_KEY_INT
        sync: false
      - key: PANDADOC_API_BASE_URL
        value: https://api.pandadoc.com
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: RECONCILIATION_LOOKBACK_DAYS
        value: "7"
      # Cloudflare R2 transcript storage (S1-27)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false

  - name: bullet-prod-env
    envVars:
      # Neon production connection string. Same handling as staging:
      # pasted into the Render dashboard via the env group screen,
      # never committed. No prod services consume this group yet
      # (they land later in Sprint 1) - the group exists now so the
      # secret is in place before those services boot.
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
      - key: NODE_VERSION
        value: "20"
      # Authentication (S1-14)
      - key: EMAIL_TOKEN_SECRET
        sync: false
      - key: DATABASE_SSL_MODE
        value: "require"
      # Resend email (S1-14)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "onboarding@bulletdigitalmedia.com"
      - key: EMAIL_CONFIRMATION_BASE_URL
        sync: false  # https://bullet-dashboard.onrender.com/confirm
      # Inngest (S1-19)
      - key: INNGEST_SIGNING_KEY
        sync: false
      - key: INNGEST_EVENT_KEY
        sync: false
      # Sentry (S1-20)
      # Shared per environment: applies to every service in this env group.
      # When the -prod services are instantiated later in Sprint 1, each
      # gets its own per-service SENTRY_DSN / NEXT_PUBLIC_SENTRY_DSN (and the
      # dashboard build-time SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT),
      # pointing at the *-prod Sentry projects - mirroring the staging
      # services below.
      - key: SENTRY_ENVIRONMENT
        value: "production"
      # PandaDoc webhook (S1-22) - per account (S1-25c: UK + International)
      - key: PANDADOC_WEBHOOK_SECRET_UK
        sync: false
      - key: PANDADOC_WEBHOOK_SECRET_INT
        sync: false
      # S1-23 reconciliation cron + S1-25c per-account API keys
      - key: PANDADOC_API_KEY_UK
        sync: false
      - key: PANDADOC_API_KEY_INT
        sync: false
      - key: PANDADOC_API_BASE_URL
        value: https://api.pandadoc.com
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: RECONCILIATION_LOOKBACK_DAYS
        value: "7"
      # Cloudflare R2 transcript storage (S1-27)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false

services:
  # NOTE: the legacy static site `Bullet-Digital-Media-Progress`
  # (slug bullet-digital-media-progress) lives in the IzzyAgents
  # workspace and is intentionally NOT declared here. It was never
  # actually instantiated as a Blueprint service - the previous
  # render.yaml `bullet-progress` block was aspirational. The live
  # service auto-deploys from this repo via its own per-service
  # GitHub connection. To rebuild or reconfigure it, edit it
  # directly in the Render dashboard. See docs/CHANGELOG.md entry
  # 18/05/2026 (workspace remediation) for context.

  # ─── FastAPI (staging) ────────────────────────────────
  # Fully functional: serves GET /healthz returning {"status":"ok"}.
  # Real routes, DB session wiring, and middleware land in S1-12.
  - type: web
    name: bullet-api-staging
    runtime: python
    rootDir: apps/api
    plan: starter
    branch: main
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn bullet_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - fromGroup: bullet-staging-env
      # S1-17: browser origins allowed for credentialed CORS (the dashboard).
      # Credentialed CORS forbids `*`, so the dashboard host is listed
      # explicitly. Comma-separate to allow more origins (e.g. a preview URL).
      - key: CORS_ALLOW_ORIGINS
        value: https://bullet-dashboard-staging.onrender.com
      # Sentry (S1-20)
      # Per-service DSN: points at the `bullet-api-staging` Sentry project.
      # Pasted into the Render dashboard once the Sentry account is upgraded
      # to allow the extra project; empty until then -> Sentry stays disabled.
      - key: SENTRY_DSN
        sync: false

  # ─── Inngest worker (staging) ─────────────────────────
  # S1-19: Inngest background functions are served via the FastAPI HTTP
  # endpoint (bullet-api-staging /api/inngest). Inngest Cloud calls that
  # endpoint to invoke registered functions; no separate TCP server is
  # needed here. This worker process logs a health line and sleeps so
  # Render keeps a long-running dyno available for future Inngest SDK
  # worker mode or out-of-band jobs (S1-25+). Real job logic replaces
  # the sleep in those later tasks.
  - type: worker
    name: bullet-worker-staging
    runtime: python
    rootDir: apps/api
    plan: starter
    branch: main
    buildCommand: pip install uv && uv sync --frozen
    startCommand: >-
      uv run python -c "
      import time, logging;
      logging.basicConfig(level=logging.INFO);
      logging.info('bullet-worker-staging: Inngest functions served via bullet-api-staging /api/inngest');
      logging.info('This process monitors Inngest job health. Real background jobs land in S1-25+.');
      [time.sleep(3600) for _ in iter(int, 1)]"
    envVars:
      - fromGroup: bullet-staging-env

  # ─── Next.js dashboard (staging) ──────────────────────
  # S1-21: Upgraded from static placeholder to Next.js web service.
  # S1-16 (running in parallel) delivers the actual Next.js scaffold
  # under apps/dashboard. The health check endpoint is added by S1-16.
  - type: web
    name: bullet-dashboard-staging
    runtime: node
    rootDir: apps/dashboard
    plan: starter
    branch: main
    buildCommand: npm install -g pnpm && pnpm install && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/healthz
    envVars:
      - fromGroup: bullet-staging-env
      - key: NEXT_PUBLIC_API_URL
        value: https://bullet-api-staging.onrender.com
      # Sentry (S1-20)
      # Per-service DSN for the browser bundle: points at the
      # `bullet-dashboard-staging` Sentry project. Pasted into the Render
      # dashboard once the Sentry account is upgraded; empty -> disabled.
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      # Build-time only: used by the Sentry webpack/next plugin to upload
      # source maps during `pnpm build`. Not read at runtime.
      - key: SENTRY_AUTH_TOKEN
        sync: false
      # Sentry org slug. Kept sync:false to avoid guessing the slug; pasted
      # in the Render dashboard.
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        value: "bullet-dashboard-staging"

  # ─── Cron job (staging) ───────────────────────────────
  # S1-23: nightly PandaDoc reconciliation. Pulls completed documents from the
  # PandaDoc API and, for any signed doc missing an onboarding_events row,
  # inserts a synthetic pandadoc.signed event + posts a Slack alert (the safety
  # net for missed webhook deliveries). Idempotent via the (event_type,
  # external_id) unique constraint, so a run with nothing new is a no-op.
  # NOTE: Render cron schedules are UTC-only with no DST support. "0 2 * * *" is
  # 02:00 UTC = 03:00 UK during BST and 02:00 UK during GMT; a daily safety-net
  # reconcile tolerates this ±1h drift. When PANDADOC_API_KEY is unset the job
  # logs "disabled" and exits 0.
  - type: cron
    name: bullet-cron-staging
    runtime: python
    rootDir: apps/api
    plan: starter
    branch: main
    schedule: "0 2 * * *"
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run python -m bullet_api.crons.reconcile_pandadoc
    envVars:
      - fromGroup: bullet-staging-env
