# Pre-commit hooks for the Bullet Digital Media monorepo.
# Install with: uvx pre-commit install
# Run manually: uvx pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(docs/|emails/|meeting_notes/|questionnaire_responses/|scope/|progress-site/dist/)
      - id: end-of-file-fixer
        exclude: ^(docs/|emails/|meeting_notes/|questionnaire_responses/|scope/|progress-site/dist/)
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
